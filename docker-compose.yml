services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: personal_os
      POSTGRES_PASSWORD: local-only
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - personal-os-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_os"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm start
    environment:
      DATABASE_URL: postgresql://postgres:local-only@db:5432/personal_os
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      - personal-os-node-modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev --workspace @personal-os/web -- --host 0.0.0.0 --port 4173
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - .:/workspace
      - personal-os-node-modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  personal-os-postgres:
  personal-os-node-modules:
